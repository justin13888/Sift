# D-61 — **the platform's own application toolchain owns the bundle**, and the Rust core is
# built into a static library it links. This file is the committed source of truth for that
# project; `Sift.xcodeproj` is generated from it by XcodeGen and is not committed.
#
# **Why generated rather than a committed `.xcodeproj`.** D-61 rejects "a bespoke script
# assembling the bundle from parts", and nothing here assembles one: XcodeGen emits a project,
# and Xcode remains the thing that compiles, links, assembles, signs and stamps the bundle.
# What D-61 protects is that the Info.plist, the URL types, the entitlements and the signing
# posture live in the platform's own project format and are enforced by its own machinery, and
# they do. What is bought is a spec a reviewer can read: the alternative is four hundred lines
# of UUID-keyed plist that no diff explains and every merge fights over.

name: Sift

options:
  bundleIdPrefix: net.justinchung
  # D-46's floor. Structural rather than conservative: the modern sandbox-legal
  # background-residency mechanism registers the *main application*, while the older one
  # requires a separate helper executable inside the bundle — a second process, which would
  # make D-2 false on the App Store channel. One of the places the floor is stated;
  # docs/build/workspace.md lists them all, and they change together.
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

# The OAuth clients, one per provider kind, and the callback scheme derived from the one that
# needs a derived scheme — `SIFT_OAUTH_CLIENT_ID_<KIND>` and `SIFT_OAUTH_SCHEME`, which
# `Info.plist` substitutes.
#
# **In a file, because they were in the environment and that is what broke.** These two were
# written here as `${SIFT_OAUTH_CLIENT_ID:-}` and `${SIFT_OAUTH_SCHEME:-net.justinchung.sift}`.
# XcodeGen implements no such operator and passed the token through verbatim, so the generated
# project set each setting to its own name; the values only reached a bundle because
# `xcodebuild` inherits the environment `mise run macos` had exported, and Xcode's recursion
# guard fell through to it. Every other way of building — a bare `xcodebuild`, an Xcode
# window, a configuration built when this task was not exporting them — produced a bundle with
# no client and no derived scheme, and said nothing, because an Info.plist key whose expansion
# is empty is *removed* rather than emptied. The failure surfaced in a browser, after consent,
# as a callback with nowhere to go.
#
# `mise run macos` writes this file on every build, including the build with no client
# configured. It is not committed, for the reason `oauth-client.txt` is not: a client
# identifier is not a secret — it appears in every authorization URL, which is why PKCE
# exists — but it is per-installation configuration, and one baked into the repository would
# make every checkout share one client, one quota and one consent screen.
configFiles:
  Debug: OAuthClient.xcconfig
  Release: OAuthClient.xcconfig

settings:
  base:
    # The identifier register in `docs/product/platform-baseline.md` — consumed once, for the
    # life of the project, and never changed after first submission to any channel.
    PRODUCT_BUNDLE_IDENTIFIER: net.justinchung.sift
    PRODUCT_NAME: Sift
    INFOPLIST_FILE: Info.plist

    GENERATE_INFOPLIST_FILE: NO

    # D-62 — one user-facing version identifying a source revision, the same on every channel,
    # and a build number space that begins at 1 and is never reused or decreased.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

    SWIFT_VERSION: "5.9"

    # D-60 — the Swift shell reaches the C ABI through a module map over the generated header.
    # This is what makes `import CSift` resolve; the map itself points at the one artefact both
    # sides compile against, in the Rust workspace.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CSift

    # D-61's static library. One archive, one symbol surface, nothing resolved at runtime —
    # which is what keeps D-59's ABI leaf genuinely a leaf.
    OTHER_LDFLAGS: -lsift_abi

    # `cargo` builds one architecture, so the project builds the one it has. D-46's universal
    # artefact is not addressed here and is not addressed anywhere else yet either.
    #
    # `ARCHS` as well as `ONLY_ACTIVE_ARCH`, because an archive ignores the second: it builds
    # for a generic destination, asks for every architecture, and fails to link the one
    # `cargo` did not build.
    ONLY_ACTIVE_ARCH: YES
    ARCHS: $(NATIVE_ARCH_ACTUAL)

    # **D-45 — signed under the team, sandboxed, hardened, in both configurations.**
    #
    # The team identifier is issued and recorded in the register in
    # `docs/product/platform-baseline.md`, so the bundle is signed under it. One entitlement set
    # (`Sift.entitlements`) serves every configuration: a Debug build that ran unsandboxed, or
    # without the Keychain access group, would exercise a different product from the one that
    # ships — a different container, a different keychain — and hide exactly the failures this
    # posture exists to surface.
    #
    # The split is in the *identity*, not in the entitlements:
    #
    #   - **Debug** is built and signed with the development identity. Signing is automatic
    #     because the access group is a restricted entitlement: the platform kills a process
    #     that claims it without a provisioning profile authorising it, and the automatic style
    #     is what fetches that profile. The toolchain adds `get-task-allow` here, so a debugger
    #     can attach — to this configuration only.
    #   - **Release** is archived, then exported for Developer ID distribution
    #     (`ExportOptions.plist`), which re-signs with the Developer ID Application identity,
    #     embeds the Developer ID profile, and timestamps. `get-task-allow` is never added.
    #
    # The hardened runtime is on in both, and no entitlement relaxes it: the threat model puts
    # an in-address-space attacker out of scope *because the platform prevents it*, and
    # notarization refuses a binary without it.
    #
    # A machine with no identity at all — CI first — builds with `mise run macos --ad-hoc`,
    # which overrides the identity and nothing else, and says so. See `mise-tasks/macos`.
    CODE_SIGN_ENTITLEMENTS: Sift.entitlements
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 854G577S2Y
    ENABLE_HARDENED_RUNTIME: YES

  configs:
    # Each configuration links the archive its own `cargo` profile produced. Pointing both `-L`
    # paths at the linker unconditionally — which is what `Package.swift` used to do — lets a
    # release build resolve `libsift_abi.a` out of `target/debug` when the release archive is
    # missing, and say nothing about it.
    Debug:
      LIBRARY_SEARCH_PATHS: [$(inherited), $(SRCROOT)/../../target/debug]
    Release:
      LIBRARY_SEARCH_PATHS: [$(inherited), $(SRCROOT)/../../target/release]
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Sift:
    type: application
    platform: macOS
    sources:
      - path: Sources/SiftShell
    scheme:
      gatherCoverageData: false
