# Sift workspace.
#
# The crate graph is D-59: layered crates whose dependency edges all point one way,
# from the shell boundary down toward the store. The C ABI is a leaf that nothing in
# the core depends on. Each provider adapter is isolated and may not see the others.
#
# The layer of a crate is its directory under crates/. `cargo xtask arch` enforces the
# direction of every edge; it is a build failure, not a review convention.
#
# See docs/build/workspace.md.

[workspace]
resolver = "3"
members = [
    # Foundation — limits, identifiers, the state register, the error states.
    "crates/foundation/sift-foundation",
    "crates/foundation/sift-subsystem",
    "crates/foundation/sift-alloc",
    "crates/foundation/sift-observe",
    "crates/foundation/sift-runtime",

    # Storage — the store, blobs, the index, the encryption layer.
    "crates/storage/sift-crypto",
    "crates/storage/sift-store",
    "crates/storage/sift-blobs",
    "crates/storage/sift-index",

    # Rendering — MIME parse, sanitizer, blocker, dark transform, resource broker.
    "crates/rendering/sift-mime",
    "crates/rendering/sift-sanitize",
    "crates/rendering/sift-css",
    "crates/rendering/sift-block",
    "crates/rendering/sift-broker",
    "crates/rendering/sift-pipeline",

    # Providers — the capability abstraction, the transport, and one crate per adapter.
    "crates/providers/sift-provider",
    "crates/providers/sift-http",
    # The register: the one crate above the adapters that names them.
    "crates/providers/sift-registry",
    "crates/providers/sift-jmap",
    "crates/providers/sift-graph",
    "crates/providers/sift-gmail",
    "crates/providers/sift-imap",

    # Application — sync, the mutation queue, scheduling, the pressure governor,
    # network conditions, the credential broker.
    "crates/application/sift-scheduler",
    "crates/application/sift-net",
    "crates/application/sift-credentials",
    "crates/application/sift-sync",
    "crates/application/sift-mutations",
    "crates/application/sift-governor",
    "crates/application/sift-lifecycle",
    # The assembled application, below the boundary so both shells get the same one.
    "crates/application/sift-app",
    # NFR-26's scale corpus, written through the ingest path into a container the application
    # opens. A tool, but placed by the layer table like everything else: it assembles the
    # application-layer ingest and container, so it sits beside them.
    "crates/application/sift-corpus",

    # Presentation — windowing, selection, formatting, merge and diff.
    "crates/presentation/sift-presentation",
    # The observation registry, above the application and below the ABI.
    "crates/presentation/sift-session",

    # ABI — the C entry points of D-17, and nothing else. A leaf.
    "crates/abi/sift-abi",

    # Shells — above the ABI. The macOS shell is Swift and outside this workspace; the
    # Linux shell and D-65's command-driven harness are Rust and in it.
    "crates/shells/sift-gtk",
    "crates/shells/sift-harness",
    # NFR-45's soak harness and NFR-44's overhead benchmark. A shell by the same definition:
    # it drives the assembled application and has no window.
    "crates/shells/sift-soak",

    # Tooling. Not a layer; excluded from the architecture rules it enforces.
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/justin13888/Sift"
publish = false

# The minimum supported toolchain, recorded once, here. A build failing on this floor is a
# defect in Sift's own code rather than an invitation to raise it.
#
# **Raised from 1.85 to 1.88 when `adblock` was vendored**, and the change is deliberate
# rather than incidental — which is the distinction workspace.md draws: *a vendored
# dependency's own floor becomes Sift's on the day it is vendored.*
#
# Two things about how that happened are worth recording. D-10 names that filter engine, so
# this was not an optional dependency somebody could have declined. And the crate **declares
# no `rust-version` of its own** while using language features stabilised in 1.88, so nothing
# announced the change — the per-change job that builds against this floor is the only reason
# it was noticed rather than discovered by a contributor on an older toolchain.
rust-version = "1.88"

[workspace.lints.rust]
# Overview confines unsafe to exactly four places, from the first commit. This is the
# crate-level prohibition that expresses it; anything later needing unsafe elsewhere is
# asking for a fifth exception, and has to ask. The four exceptions opt out explicitly
# and `cargo xtask arch` asserts that the set of opt-outs is exactly those four.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
sift-foundation = { path = "crates/foundation/sift-foundation" }
sift-subsystem  = { path = "crates/foundation/sift-subsystem" }
sift-alloc      = { path = "crates/foundation/sift-alloc" }
sift-observe    = { path = "crates/foundation/sift-observe" }
sift-runtime    = { path = "crates/foundation/sift-runtime" }
sift-crypto     = { path = "crates/storage/sift-crypto" }
sift-store      = { path = "crates/storage/sift-store" }
sift-blobs      = { path = "crates/storage/sift-blobs" }
sift-index      = { path = "crates/storage/sift-index" }
sift-mime       = { path = "crates/rendering/sift-mime" }
sift-sanitize   = { path = "crates/rendering/sift-sanitize" }
sift-css        = { path = "crates/rendering/sift-css" }
sift-block      = { path = "crates/rendering/sift-block" }
sift-broker     = { path = "crates/rendering/sift-broker" }
sift-pipeline   = { path = "crates/rendering/sift-pipeline" }
sift-provider   = { path = "crates/providers/sift-provider" }
sift-http       = { path = "crates/providers/sift-http" }
sift-registry   = { path = "crates/providers/sift-registry" }
sift-jmap       = { path = "crates/providers/sift-jmap" }
sift-graph      = { path = "crates/providers/sift-graph" }
sift-gmail      = { path = "crates/providers/sift-gmail" }
sift-imap       = { path = "crates/providers/sift-imap" }
sift-scheduler  = { path = "crates/application/sift-scheduler" }
sift-net        = { path = "crates/application/sift-net" }
sift-credentials = { path = "crates/application/sift-credentials" }
sift-sync       = { path = "crates/application/sift-sync" }
sift-mutations  = { path = "crates/application/sift-mutations" }
sift-governor   = { path = "crates/application/sift-governor" }
sift-lifecycle  = { path = "crates/application/sift-lifecycle" }
sift-app        = { path = "crates/application/sift-app" }
sift-presentation = { path = "crates/presentation/sift-presentation" }
sift-session    = { path = "crates/presentation/sift-session" }
sift-abi        = { path = "crates/abi/sift-abi" }

[profile.release]
# D-47: the release binary unwinds. The pipeline establishes a catch boundary at each
# stage and degrades that message to FR-9's raw view; abort-on-panic was rejected.
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = 1
