[package]
name = "sift-store"
description = "D-6/D-21/D-74: the per-account store and journal, beneath D-42's page encryption."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

# One of the four places overview.md permits unsafe code. It does not take the
# workspace lint set, and `cargo xtask arch` asserts that the set of crates doing so
# is exactly those four.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "deny"

[dependencies]
sift-foundation.workspace = true
sift-crypto.workspace = true
# D-21 names SQLite explicitly, which is the case where a dependency is named because the
# choice *is* the architectural decision. Bundled so the version is Sift's rather than the
# platform's — D-15 pins the rendering engine for the same reason, and a store format that
# moved with the OS would be worse.
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
