[package]
name = "sift-abi"
description = "D-17/D-66: the C entry points. A leaf; nothing in the core depends on it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

# One of the four places overview.md permits unsafe code. It does not take the
# workspace lint set, and `cargo xtask arch` asserts that the set of crates doing so
# is exactly those four.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "deny"

[dependencies]
sift-foundation.workspace = true
sift-presentation.workspace = true
# D-18's registry and the assembled application beneath it. The ABI is still a leaf: the
# edges point down, and nothing in the core depends on this crate.
sift-session.workspace = true
sift-app.workspace = true
# The broker's answer vocabulary, which the resource entry point translates.
sift-broker.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]
