[package]
name = "sift-alloc"
description = "D-24: the tagging global allocator. The subsystem tag travels in the allocation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

# One of the four places overview.md permits unsafe code. It does not take the
# workspace lint set, and `cargo xtask arch` asserts that the set of crates doing so
# is exactly those four.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "deny"

[dependencies]
