[package]
name = "sift-css"
description = "D-27: the CSS cascade, and the dark transform built over it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sift-foundation.workspace = true
sift-sanitize.workspace = true
# The same argument D-26 makes for the HTML tree builder, applied to CSS: this is
# attacker-controlled input and the tokenizer has to be the specification's rather than a
# reading of it. cssparser is CSS Syntax Level 3, and is the tokenizer the browser engines
# this pipeline is measured against use. **The cascade over it is Sift's**, which is the
# half D-27 commits to and the half no crate provides.
cssparser = "0.37"
