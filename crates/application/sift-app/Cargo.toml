[package]
name = "sift-app"
description = "The assembled application: accounts, their stores, their queues, and the adapters behind them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sift-foundation.workspace = true
sift-provider.workspace = true
# The register, so that this layer resolves an opaque kind rather than naming a provider.
# D-12 bans the name here and `cargo xtask invariants` enforces it.
sift-registry.workspace = true
# The transport an authorization's token exchange runs over. One host, one request.
sift-http.workspace = true
sift-store.workspace = true
# FR-20's operator grammar. The parser is the index's; executing it is the application's.
sift-index.workspace = true
sift-sync.workspace = true
# D-25's single timing wheel. The crate existed, was tested, and was reached by nothing: no
# edge to it from here meant every periodic obligation in the specification — the aligned
# poll, the queue flush, the backoff retry — had no caller, and mail arrived only when a
# person did something. This is that edge.
sift-scheduler.workspace = true
# D-93's governor. The same story as the scheduler above it: a complete tier machine with
# hysteresis, tested, and reached by no crate in the workspace — so the operating system's
# pressure signal had nowhere to arrive and L3 never destroyed anything.
sift-governor.workspace = true
# The shed targets the governor names. One enum, so a tier and a cache cannot disagree
# about which subsystem is which.
sift-subsystem.workspace = true
sift-mutations.workspace = true
sift-credentials.workspace = true
# The container's registry is sealed like any other database, under a key derived from the
# installation secret by D-106's role separation.
sift-crypto.workspace = true
# 128 random bits for an account identity, and 32 for a key. Already vendored for the OAuth
# state and verifier, so this adds nothing to `deps/approved.txt`.
getrandom = "0.4"
# The hostile-input path. A body reaches a shell only after all seven stages, and the broker
# outlives the render because the body view resolves resources against its token afterwards.
sift-mime.workspace = true
sift-pipeline.workspace = true
sift-broker.workspace = true
sift-block.workspace = true
# D-21's engine, reached the same way the store reaches it. The application writes through
# the store's own transactions rather than around them.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
sift-mutations.workspace = true
