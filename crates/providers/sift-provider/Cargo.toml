[package]
name = "sift-provider"
description = "D-12: the capability model and the adapter contract. Adapters see only this."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
sift-foundation.workspace = true

# PKCE's S256 challenge, and the randomness the verifier and D-36's state parameter need.
#
# The hash is not negotiable — it is named in the method sent to the provider — and the
# RustCrypto family is the one aes-gcm already brought under D-76, so this adds a hash
# rather than a second cryptographic ecosystem.
# The token endpoint answers in JSON, and D-88 turns on telling a well-formed provider
# error from something that merely arrived in its place.
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
