[package]
name = "xtask"
description = "Build-time enforcement of the rules docs/build/workspace.md states as normative."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# xtask does not take the workspace lint set wholesale. `print_stdout` and
# `print_stderr` are denied there because a resident mail client writing to a terminal is
# a defect — NFR-55 governs what may be recorded at all, and the answer is a bounded
# local log, not stdout. A build tool reporting its findings is the opposite case: that
# is the whole of what it does.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "deny"

[dependencies]
serde_json = "1"
